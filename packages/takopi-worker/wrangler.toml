# Takopi Worker with Container DO

name = "clawdbox-takopi-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

observability.enabled = true

[[containers]]
class_name = "TakopiContainerDO"
image = "../takopi-container/Dockerfile"
instance_type = "basic"
max_instances = 1

[[durable_objects.bindings]]
name = "TAKOPI_CONTAINER"
class_name = "TakopiContainerDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TakopiContainerDO"]

# Secrets Store binding (for accessing API keys)
# [[secrets_stores.bindings]]
# binding = "SECRETS"
# store = "clawdbox-secrets"
