# Agent Worker with Container DO + Orchestrator DO
# This Worker handles Telegram webhooks and runs Codex via Containers.

name = "clawdbox-agent-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Enable workers.dev subdomain for direct access
workers_dev = true

# Container configuration
[[containers]]
class_name = "AgentContainerDO"
image = "../agent-container/Dockerfile"
instance_type = "basic"  # 1/4 vCPU, 1 GiB RAM, 4 GB disk
max_instances = 5

# Durable Objects configuration
[[durable_objects.bindings]]
name = "AGENT_CONTAINER"
class_name = "AgentContainerDO"

# Orchestrator DO (per-chat)
[[durable_objects.bindings]]
name = "ORCHESTRATOR"
class_name = "OrchestratorDO"

# Manager DO (settings/credentials)
[[durable_objects.bindings]]
name = "MANAGER"
class_name = "ManagerDO"

# SQLite storage for Container DOs (required for containers)
[[migrations]]
tag = "v2"
new_sqlite_classes = ["ManagerDO"]

# Secrets Store binding (for accessing API keys)
# [[secrets_stores.bindings]]
# binding = "SECRETS"
# store = "clawdbox-secrets"
