# Operator Worker with Durable Object
# This Worker hosts the OperatorDO that manages agent orchestration

name = "clawdbox-operator"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Enable workers.dev subdomain for direct access
workers_dev = true

# Durable Objects configuration
[[durable_objects.bindings]]
name = "OPERATOR"
class_name = "OperatorDO"

# SQLite storage for Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["OperatorDO"]

# Secrets Store binding (for accessing stored secrets)
# [[secrets_stores.bindings]]
# binding = "SECRETS"
# store = "clawdbox-secrets"

# R2 binding (for repo storage)
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "clawdbox-storage"
