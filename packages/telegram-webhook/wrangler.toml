# Cloudflare Worker configuration for Telegram Webhook
name = "clawdbox-telegram-webhook"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Node.js compatibility for Effect
nodejs_compat = true

# Durable Object bindings (Operator DO)
[[durable_objects.bindings]]
name = "OPERATOR"
class_name = "OperatorDO"
# script_name will be set when Operator DO is deployed separately

# Secrets (set via wrangler secret)
# TELEGRAM_BOT_TOKEN - Telegram Bot API token

# Environment-specific configuration
[env.production]
name = "clawdbox-telegram-webhook"
route = { pattern = "telegram.clawdbox.ai/*", zone_name = "clawdbox.ai" }

[env.staging]
name = "clawdbox-telegram-webhook-staging"
workers_dev = true
