# Cloudflare Worker configuration for Telegram Webhook
name = "clawdbox-telegram-webhook"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Node.js compatibility for Effect
compatibility_flags = ["nodejs_compat"]

# Enable workers.dev subdomain for development
workers_dev = true

# Environment variables
[vars]
OPERATOR_URL = "https://clawdbox-operator.eduardogbg.workers.dev"

# Secrets (set via wrangler secret):
# TELEGRAM_BOT_TOKEN - Telegram Bot API token (required)
# WEBHOOK_SECRET - Secret token for webhook verification (optional)

# Environment-specific configuration
[env.production]
name = "clawdbox-telegram-webhook"
route = { pattern = "telegram.clawdbox.ai/*", zone_name = "clawdbox.ai" }
[env.production.vars]
OPERATOR_URL = "https://clawdbox-operator.eduardogbg.workers.dev"

[env.staging]
name = "clawdbox-telegram-webhook-staging"
workers_dev = true
[env.staging.vars]
OPERATOR_URL = "https://clawdbox-operator.eduardogbg.workers.dev"
