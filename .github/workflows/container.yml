name: Container Build

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to registry'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'packages/agent-container/**'

jobs:
  build:
    name: Build Agent Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build TypeScript
        run: cd packages/agent-container && bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clawdbox-agent
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: packages/agent-container
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "### Container Image Built 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  test-container:
    name: Test Container
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.push
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and test container
        run: |
          # Pull the image
          docker pull ghcr.io/${{ github.repository_owner }}/clawdbox-agent:latest

          # Run a simple health check
          docker run --rm --entrypoint /bin/sh ghcr.io/${{ github.repository_owner }}/clawdbox-agent:latest -c "echo 'Container is functional'"

          # Verify bun is installed
          docker run --rm --entrypoint bun ghcr.io/${{ github.repository_owner }}/clawdbox-agent:latest --version

          # Verify node is installed
          docker run --rm --entrypoint node ghcr.io/${{ github.repository_owner }}/clawdbox-agent:latest --version

          echo "### Container Tests Passed ✅" >> $GITHUB_STEP_SUMMARY
