name: CI

on:
  push:
    branches: [main, develop, "ralph/*"]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'  # For alchemy-effect fork if it becomes a submodule

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeCheck packages/iac
        run: cd packages/iac && bun run typecheck

      - name: TypeCheck packages/operator
        run: cd packages/operator && bun run typecheck

      - name: TypeCheck packages/agent-container
        run: cd packages/agent-container && bun run typecheck

      - name: TypeCheck packages/telegram-webhook
        run: cd packages/telegram-webhook && bun run typecheck

      - name: TypeCheck packages/agent-worker
        run: cd packages/agent-worker && bun run typecheck

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run IAC unit tests
        run: cd packages/iac && bunx vitest run test/operator.test.ts
        # Only run non-integration tests that don't require credentials

      - name: Run telegram-webhook tests
        run: cd packages/telegram-webhook && bunx vitest run

      - name: Run agent-container tests
        run: cd packages/agent-container && bunx vitest run

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Only run on main branch or when explicitly triggered
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: cloudflare
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run IaC integration tests
        run: cd packages/iac && bun run test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
