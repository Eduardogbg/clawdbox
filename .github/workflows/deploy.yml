name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_operator:
        description: 'Deploy Operator Worker'
        required: false
        default: true
        type: boolean
      deploy_telegram:
        description: 'Deploy Telegram Webhook Worker'
        required: false
        default: true
        type: boolean
      deploy_agent_worker:
        description: 'Deploy Agent Worker (requires Docker for container image)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'packages/operator/**'
      - 'packages/telegram-webhook/**'
      - 'packages/agent-worker/**'
      - 'packages/agent-container/**'

jobs:
  deploy-operator:
    name: Deploy Operator
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.deploy_operator }}
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeCheck
        run: cd packages/operator && bun run typecheck

      - name: Deploy Operator Worker
        run: |
          cd packages/operator
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-telegram:
    name: Deploy Telegram Webhook
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.deploy_telegram }}
    environment: ${{ inputs.environment || 'staging' }}
    needs: deploy-operator  # Telegram webhook depends on Operator
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeCheck
        run: cd packages/telegram-webhook && bun run typecheck

      - name: Deploy Telegram Webhook Worker
        run: |
          cd packages/telegram-webhook
          npx wrangler deploy ${{ inputs.environment == 'production' && '--env production' || '--env staging' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-agent-worker:
    name: Deploy Agent Worker
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_agent_worker }}
    environment: ${{ inputs.environment || 'staging' }}
    needs: deploy-operator
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build agent-container
        run: cd packages/agent-container && bun run build

      - name: TypeCheck
        run: cd packages/agent-worker && bun run typecheck

      # Wrangler will build and push the Docker image automatically
      - name: Deploy Agent Worker with Container
        run: |
          cd packages/agent-worker
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-iac:
    name: Deploy IaC Resources
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Apply IaC
        run: cd packages/iac && bun run alchemy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
